<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>André Cordeiro</title>
<meta name="description" content="Arquivo de textos de André Cordeiro.">
<style>
@font-face{font-family:Druk;src:url("assets/fonts/druk-condensed.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:Portrait;src:url("assets/fonts/portrait-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Portrait;src:url("assets/fonts/portrait-italic.woff2") format("woff2");font-style:italic;font-display:swap}
:root{--paper:#eeece6;--ink:#242220;--rule:#a39f96}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Portrait,Georgia,serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:.2em}a:focus-visible{outline:2px solid currentColor;outline-offset:5px}
.page{width:min(100% - 64px,1040px);margin:0 auto;padding:24px 0 40px}
.masthead{border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:baseline;padding-bottom:7px;font-size:13px}
.masthead>span{text-align:center}.masthead nav{text-align:right}
.cover{display:grid;place-items:center;min-height:clamp(270px,39vw,490px);padding:55px 0 64px}
.cover h1{font-family:Druk,Impact,'Arial Narrow',sans-serif;font-weight:900;font-size:clamp(60px,12vw,170px);line-height:.85;letter-spacing:-.025em;margin:0;text-align:center}
.imprint{border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:8px 0 36px;font-size:12px;line-height:1.3}
.imprint p{margin:0}.imprint p:last-child{grid-column:5/7}
.feature{margin:0;display:block;border-bottom:1px solid var(--rule);padding-bottom:18px}
.plate{height:clamp(240px,46vw,475px);background:#292724;display:grid;place-items:center;overflow:hidden;color:#e8e5de}
.plate svg{width:100%;height:100%;display:block}
.feature figcaption{display:grid;grid-template-columns:1fr 3fr 1fr;gap:16px;align-items:baseline;padding-top:12px;font-size:12px}
.feature strong{font-size:clamp(24px,4vw,44px);font-weight:400;letter-spacing:-.025em;line-height:1.05}.feature figcaption span:last-child{text-align:right}
.archive{margin:95px 0 100px;display:grid;grid-template-columns:1fr 4fr;gap:24px}
.archive h2{font-size:15px;font-weight:400;margin:0}
.entries{border-top:1px solid var(--rule)}.entry{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:baseline;padding:17px 0;border-bottom:1px solid var(--rule)}.entry span,.entry time{font-size:12px}.entry a{font-size:clamp(20px,3vw,30px);line-height:1.1}
footer{border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;padding-top:8px;font-size:12px}
@media(max-width:600px){.page{width:calc(100% - 36px);padding-top:16px}.masthead{font-size:12px;grid-template-columns:1fr auto}.masthead>span{display:none}.cover{min-height:240px;padding:55px 0}.cover h1{font-size:clamp(53px,14vw,84px)}.imprint{grid-template-columns:1fr 1fr 1fr;gap:10px;padding-bottom:22px;font-size:11px}.imprint p:last-child{grid-column:3}.plate{height:clamp(220px,72vw,360px)}.feature figcaption{grid-template-columns:1fr auto;gap:8px}.feature figcaption strong{grid-column:1/-1;grid-row:2}.archive{display:block;margin:60px 0 75px}.archive h2{margin-bottom:15px}.entry{grid-template-columns:26px 1fr auto;gap:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Motion follows the sequence of opening and reading a printed cover. */
:root{--ease-editorial:cubic-bezier(.22,.61,.36,1)}
.masthead,.imprint{position:relative}
@media(prefers-reduced-motion:no-preference){
  .motion .masthead,.motion .imprint{border-color:transparent}
  .motion .masthead::after,.motion .imprint::before{content:"";position:absolute;left:0;right:0;height:1px;background:var(--rule);transform:scaleX(0);transform-origin:left;animation:ink-rule 850ms var(--ease-editorial) forwards}
  .motion .masthead::after{bottom:0}
  .motion .imprint::before{top:0;animation-delay:420ms}
  .motion .masthead>*{animation:ink-in 650ms var(--ease-editorial) both}
  .motion .cover h1{animation:type-reveal 1100ms var(--ease-editorial) 100ms both}
  .motion .imprint p{animation:ink-in 750ms var(--ease-editorial) both;animation-delay:calc(450ms + var(--order,0)*85ms)}
  .motion .plate{clip-path:inset(0 0 100% 0);transition:clip-path 1150ms var(--ease-editorial)}
  .motion .plate svg{transform:scale(1.035);transition:transform 1400ms var(--ease-editorial)}
  .motion .feature.is-visible .plate,.motion .feature:focus-within .plate{clip-path:inset(0)}
  .motion .feature.is-visible .plate svg,.motion .feature:focus-within .plate svg{transform:scale(1)}
  .motion .feature figcaption,.motion .archive h2,.motion .entry,.motion footer{opacity:0;transform:translateY(9px);transition:opacity 650ms var(--ease-editorial),transform 750ms var(--ease-editorial)}
  .motion .feature.is-visible figcaption,.motion .feature:focus-within figcaption{opacity:1;transform:none;transition-delay:240ms}
  .motion .archive.is-visible h2,.motion .archive:focus-within h2,.motion .entry.is-visible,.motion .entry:focus-within,.motion footer.is-visible{opacity:1;transform:none}
  @keyframes ink-rule{to{transform:scaleX(1)}}
  @keyframes ink-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes type-reveal{from{clip-path:inset(100% -2% 0);transform:translateY(12px)}to{clip-path:inset(-12% -2% -12%);transform:none}}
  .masthead a,.entry a{position:relative;text-decoration:none}
  .masthead a::after,.entry a::after{content:"";position:absolute;left:0;right:0;bottom:-.16em;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform 400ms var(--ease-editorial)}
  .masthead a:hover::after,.entry a:hover::after,.masthead a:focus-visible::after,.entry a:focus-visible::after{transform:scaleX(1);transform-origin:left}
}
@media(prefers-reduced-motion:no-preference) and (hover:hover) and (pointer:fine){
  .motion .feature.is-visible a:hover .plate svg{transform:scale(1.025)}
}


.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.cover{flex:1;min-height:260px}
.imprint{padding-bottom:24px}
.imprint p:last-child{grid-column:6;text-align:right}
@media(max-width:600px){.imprint p:last-child{grid-column:3}.cover{min-height:220px}}
</style>
</head>
<body><main class="page">
<header class="masthead"><a href="./">André Cordeiro</a><span></span><nav><a href="publicacoes.html">Publicações</a></nav></header>
<section class="cover" aria-label="Capa"><h1>CORDEIRO</h1></section>


</main>
<script>
(() => {
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (preference.matches || !('IntersectionObserver' in window)) return;
  const root = document.documentElement;
  const items = document.querySelectorAll('footer');
  document.querySelectorAll('.imprint p').forEach((item, i) => item.style.setProperty('--order', i));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(({target, isIntersecting}) => {
      if (!isIntersecting) return;
      target.classList.add('is-visible');
      observer.unobserve(target);
    });
  }, {threshold: 0.08});
  items.forEach(item => observer.observe(item));
  root.classList.add('motion');
  const revealAll = () => {
    observer.disconnect();
    items.forEach(item => item.classList.add('is-visible'));
    root.classList.remove('motion');
  };
  if (preference.addEventListener) preference.addEventListener('change', event => {if (event.matches) revealAll();});
  window.addEventListener('beforeprint', revealAll, {once:true});
  window.addEventListener('pageshow', event => {if (event.persisted) revealAll();});
})();
</script>
</body></html>
